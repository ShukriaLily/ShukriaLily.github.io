<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e141b;
    --panel: #161e28;
    --border: #263140;
    --text: #e7ecf2;
    --muted: #8593a3;
    --accent: #e8a33d;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
  }
  a { color: inherit; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 20px; }

  header {
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(14,20,27,0.9);
    backdrop-filter: blur(6px);
  }
  header .wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
  }
  .brand { font-family: var(--mono); font-weight: 600; }
  .brand span { color: var(--accent); }
  nav a {
    margin-left: 20px;
    text-decoration: none;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
  }
  nav a:hover { color: var(--text); }

  section.hero {
    padding: 60px 0 40px;
    border-bottom: 1px solid var(--border);
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 6px 12px;
    border-radius: 4px;
    margin-bottom: 20px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }
  section.hero h1 {
    font-family: var(--mono);
    font-size: 34px;
    margin-bottom: 10px;
  }
  section.hero p {
    color: var(--muted);
    font-size: 17px;
  }
  .terminal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted);
    margin-top: 24px;
  }
  .terminal .prompt { color: var(--accent); }

  section {
    padding: 50px 0;
    border-bottom: 1px solid var(--border);
  }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 24px;
  }
  .section-head .tag {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
  }
  .section-head h2 {
    font-family: var(--mono);
    font-size: 19px;
  }

  .project {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .project h3 {
    font-size: 16px;
    margin-bottom: 6px;
  }
  .project p {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 10px;
  }
  .project a {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tags span {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 4px;
  }

  .links {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 24px;
  }
  .btn {
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 6px;
    text-decoration: none;
    border: 1px solid var(--border);
  }
  .btn-primary {
    background: var(--accent);
    color: #1a1305;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-ghost { color: var(--text); }

  footer {
    padding: 30px 0;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    font-family: var(--mono);
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand"><!-- YOUR --><span>.</span><!-- NAME --></div>
    <nav>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<div class="wrap">

  <section class="hero">
    <div class="status-badge"><span class="dot"></span> <!-- e.g. STATUS: OPEN TO OPPORTUNITIES --></div>
    <h1><!-- Your Name --></h1>
    <p><!-- One-line intro / role, e.g. "CS student, cybersecurity concentration" --></p>

    <div class="terminal">
      <span class="prompt">visitor@portfolio</span>:~$ <!-- optional short typed-style line about you -->
    </div>
  </section>

  <section id="projects">
    <div class="section-head">
      <span class="tag">01</span>
      <h2>Projects</h2>
    </div>

    <div class="project">
      <h3><!-- Project title --></h3>
      <p><!-- Short description of what it does and why you built it --></p>
      <a href="#"><!-- Link to GitHub repo or live demo --></a>
    </div>

    <div class="project">
      <h3><!-- Project title --></h3>
      <p><!-- Short description --></p>
      <a href="#"><!-- Link --></a>
    </div>

  </section>

  <section id="skills">
    <div class="section-head">
      <span class="tag">02</span>
      <h2>Skills</h2>
    </div>
    <div class="tags">
      <!-- <span>Python</span> <span>Linux</span> <span>Networking</span> etc -->
    </div>
  </section>

  <section id="contact" style="border-bottom: none;">
    <div class="section-head">
      <span class="tag">03</span>
      <h2>Contact</h2>
    </div>
    <p style="color: var(--muted);"><!-- short line inviting people to reach out --></p>
    <div class="links">
      <a class="btn btn-primary" href="mailto:"><!-- Email me --></a>
      <a class="btn btn-ghost" href="#"><!-- LinkedIn --></a>
      <a class="btn btn-ghost" href="#"><!-- GitHub --></a>
    </div>
  </section>

</div>

<footer>
  <!-- optional footer text -->
</footer>

</body>
</html>
