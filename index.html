<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name — Portfolio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    line-height: 1.6;
    color: #222;
    background: #fff;
  }
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 20px; }

  /* ---- header / nav ---- */
  header {
    border-bottom: 1px solid #ddd;
    padding: 16px 0;
  }
  header .wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  nav a {
    margin-left: 20px;
    text-decoration: none;
    color: #333;
  }

  /* ---- hero ---- */
  section.hero {
    padding: 60px 0;
    border-bottom: 1px solid #ddd;
  }
  section.hero h1 {
    font-size: 36px;
    margin-bottom: 10px;
  }
  section.hero p {
    color: #555;
    font-size: 18px;
  }

  /* ---- generic section ---- */
  section {
    padding: 50px 0;
    border-bottom: 1px solid #ddd;
  }
  section h2 {
    font-size: 22px;
    margin-bottom: 20px;
  }

  /* ---- project card placeholder ---- */
  .project {
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .project h3 { margin-bottom: 8px; }
  .project p { color: #555; }

  /* ---- footer ---- */
  footer {
    padding: 30px 0;
    text-align: center;
    color: #777;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div><!-- your name / logo --></div>
    <nav>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<div class="wrap">

  <section class="hero">
    <h1><!-- Your Name --></h1>
    <p><!-- One-line intro / role --></p>
  </section>

  <section id="projects">
    <h2>Projects</h2>

    <div class="project">
      <h3><!-- Project title --></h3>
      <p><!-- Short description --></p>
      <!-- <a href="#">Link</a> -->
    </div>

    <div class="project">
      <h3><!-- Project title --></h3>
      <p><!-- Short description --></p>
      <!-- <a href="#">Link</a> -->
    </div>

  </section>

  <section id="skills">
    <h2>Skills</h2>
    <p><!-- List your skills here --></p>
  </section>

  <section id="contact" style="border-bottom: none;">
    <h2>Contact</h2>
    <p><!-- Email / LinkedIn / GitHub links --></p>
  </section>

</div>

<footer>
  <!-- optional footer text -->
</footer>

</body>
</html>
